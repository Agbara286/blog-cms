server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: blog-cms

  # No credential defaults here on purpose: production must supply them.
  # For local development run with SPRING_PROFILES_ACTIVE=local (see application-local.yml).
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Loads authors/tags/covers for a page of posts in a few IN queries instead of one per post.
        default_batch_fetch_size: 50

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  jackson:
    serialization:
      write-dates-as-timestamps: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

blogcms:
  # The single admin account. ADMIN_PASSWORD_HASH is a bcrypt hash — see README "Configuration".
  admin:
    email: ${ADMIN_EMAIL}
    password-hash: ${ADMIN_PASSWORD_HASH}
  jwt:
    # HMAC key for the session tokens, at least 32 characters (e.g. `openssl rand -base64 48`).
    secret: ${JWT_SECRET}
    ttl: ${JWT_TTL:8h}
  media:
    nextcloud:
      url: ${NEXTCLOUD_URL}
      username: ${NEXTCLOUD_USERNAME}
      password: ${NEXTCLOUD_PASSWORD}
      remote-directory: ${NEXTCLOUD_REMOTE_DIRECTORY:/BlogCMS}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      probes:
        enabled: true
      # /health/liveness  — process is up (never checks dependencies, so a DB outage
      #                     does not get the pod restarted in a loop)
      # /health/readiness — also requires the database, so traffic is held back until it answers
      group:
        readiness:
          include: readinessState, db

logging:
  pattern:
    console: '{"ts":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%p","logger":"%logger{36}","correlationId":"%X{correlation_id}","msg":"%m"}%n'
